<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GitHub Pages로 배포되는 HTML 문서">
  <title>HTML 문서 공유</title>
  <style>
    :root { color-scheme: light; --ink: #172554; --accent: #2563eb; --paper: #f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; color: var(--ink); background: linear-gradient(135deg, #dbeafe, var(--paper) 48%, #e0f2fe); }
    main { width: min(680px, 100%); padding: clamp(32px, 7vw, 64px); border: 1px solid #bfdbfe; border-radius: 24px; background: rgba(255,255,255,.92); box-shadow: 0 20px 55px rgba(30,64,175,.14); }
    .tag { display: inline-block; margin-bottom: 18px; padding: 6px 11px; border-radius: 999px; color: #1d4ed8; background: #dbeafe; font-weight: 700; font-size: .9rem; }
    h1 { margin: 0 0 16px; font-size: clamp(2rem, 7vw, 3.5rem); letter-spacing: -.045em; }
    p { margin: 0; font-size: 1.1rem; line-height: 1.75; color: #334155; }
    .note { margin-top: 30px; padding: 18px; border-left: 4px solid var(--accent); border-radius: 8px; background: #eff6ff; }
    code { padding: 2px 5px; border-radius: 5px; background: #e2e8f0; font-family: ui-monospace, Consolas, monospace; }
  </style>
</head>
<body>
  <main>
    <span class="tag">GitHub Pages</span>
    <h1>HTML 문서 공유</h1>
    <p>이 페이지는 GitHub에 올린 HTML 파일을 바로 공개하기 위한 기본 문서입니다.</p>
    <p class="note">내용을 바꾸려면 <code>index.html</code>을 수정한 뒤 GitHub에 업로드하세요. 배포 주소는 자동으로 최신 내용으로 갱신됩니다.</p>
  </main>
</body>
</html>
